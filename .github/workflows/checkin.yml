# 每日签到：GLaDOS + 网易云音乐
name: 每日签到

on:
  schedule:
    - cron: '30 1 * * *'      # UTC 01:30 = 北京 09:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: GLaDOS
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: python checkin.py

      - name: 网易云音乐
        env:
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
        run: python netease.py

      - name: 提交数据
        run: |
          git config user.name "签到机器人"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据没变化"
          else
            git commit -m "签到记录 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
