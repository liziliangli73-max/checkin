# GLaDOS 每日签到 + 记录数据
name: GLaDOS 签到

on:
  schedule:
    # GitHub 的 cron 是「尽力而为」：会延迟几小时，也可能整次丢掉。
    # 唯一能自己控制的办法就是多排几个点，靠数量兜住。当天已签会自动跳过。
    - cron: '0 22 * * *'      # 北京 06:00
    - cron: '30 0 * * *'      # 北京 08:30
    - cron: '30 1 * * *'      # 北京 09:30
    - cron: '0 4 * * *'       # 北京 12:00
    - cron: '30 6 * * *'      # 北京 14:30
    - cron: '0 9 * * *'       # 北京 17:00
    - cron: '30 11 * * *'     # 北京 19:30
    - cron: '30 13 * * *'     # 北京 21:30
  push:
    # 只在本文件被改动时自测一次，确认流程没坏（日常签到仍靠 schedule）
    paths:
      - '.github/workflows/glados.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '当天已签到也强制再跑一次（排查用）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 签到并记录
        id: checkin
        continue-on-error: true
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          FORCE_CHECKIN: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: python checkin.py

      - name: 提交数据
        id: commit
        run: |
          git config user.name "签到机器人"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "数据没变化"
          else
            git commit -m "签到记录 $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Pages 重新构建
        # 机器人用 GITHUB_TOKEN 推的 commit 不会自动触发 Pages 部署，这里手动点一次
        if: steps.commit.outputs.pushed == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "请求 Pages 重建…"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status: .status, url: .url}'

      - name: 失败时开 issue 提醒
        if: steps.checkin.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="签到失败 $(TZ=Asia/Shanghai date +%F)"
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -qx "$TITLE"; then
            echo "已有未关闭的同类提醒，跳过"
          else
            gh issue create --title "$TITLE" \
              --body "自动签到没成功，运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          常见原因：COOKIE 过期、站点改版、网络抖动。当天后面几个时段还会自动重试。"
          fi

      - name: 标记本次失败
        if: steps.checkin.outcome == 'failure'
        run: |
          echo "签到失败（退出码 2），详见上面「签到并记录」的日志。"
          exit 1
